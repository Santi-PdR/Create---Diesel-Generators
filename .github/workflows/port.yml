name: Forge 1.20.1 port

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile against Forge and Create
        run: ./gradlew --no-daemon --console=plain compileJava
      - name: Build reobfuscated mod
        run: ./gradlew --no-daemon --console=plain build
      - name: Upload mod and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1-port
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
          if-no-files-found: ignore
